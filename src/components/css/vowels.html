<body>
    <script>
        const str="hello world";
        let i=0;
        let count=0;
        let vowels="aeiouAEIOU";
        while(i<str.length){
            if(vowels.includes (str[i])){
                count++;

            }
            i++;
        }
        console.log(count);
        

    </script>
